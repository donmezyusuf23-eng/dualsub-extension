<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DualSub Ayarları</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 310px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      color: white;
    }
    .title-box h1 {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }
    .title-box p {
      font-size: 11px;
      color: #94a3b8;
    }
    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .row label {
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #3b82f6;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .select-box {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    .info-card {
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      margin-top: 14px;
      border-left: 3px solid #38bdf8;
    }
    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">DS</div>
    <div class="title-box">
      <h1>DualSub Ayarları</h1>
      <p>Anlık Türkçe Altyazı</p>
    </div>
  </div>

  <div class="setting-group">
    <div class="row">
      <label for="toggle-enabled">Eklentiyi Etkinleştir</label>
      <label class="switch">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label for="toggle-show-original">İngilizce Altyazıyı Göster</label>
      <label class="switch">
        <input type="checkbox" id="toggle-show-original" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label for="toggle-translation">Türkçe Altyazıyı Göster</label>
      <label class="switch">
        <input type="checkbox" id="toggle-translation" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label for="toggle-hide-site-sub">Sitenin Kendi Altyazısını Gizle</label>
      <label class="switch">
        <input type="checkbox" id="toggle-hide-site-sub">
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label for="select-position">Altyazı Konumu</label>
      <select id="select-position" class="select-box">
        <option value="bottom-high">Oynatma Çubuğunun Üstü</option>
        <option value="top">Videonun En Üstü</option>
        <option value="middle">Videonun Ortası</option>
      </select>
    </div>
  </div>

  <div class="info-card">
    💡 <b>Not:</b> Ekranda hala İngilizce görüyorsanız o sitenin kendi video oynatıcısının altyazısıdır; <b>"Sitenin Kendi Altyazısını Gizle"</b> butonunu açarak gizleyebilirsiniz.
  </div>

  <div class="footer">
    Geliştiren: Yusuf Dönmez
  </div>

  <script src="popup.js"></script>
</body>
</html>
